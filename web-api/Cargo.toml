[package]
name = "aq-web-app"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4.15.0" }
clap = { version = "4.6.6", features = ["derive"] }
env_logger = { version = "0.11.11" }
log = { version = "0.4.34" }
thiserror = { version = "2.0.20" }
time = { version = "0.3.55", features = ["macros", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
